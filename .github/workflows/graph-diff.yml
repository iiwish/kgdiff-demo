name: Graph diff

on:
  pull_request:
    paths: [ontology/**, vocab/**]

permissions:
  contents: read
  pull-requests: write # the comment

jobs:
  kgdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: iiwish/kgdiff@v0
        with:
          files: |
            ontology/*.obo
            vocab/*.ttl
